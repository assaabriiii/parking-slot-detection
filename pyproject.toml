[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-mvp"
version = "0.1.0"
description = "Lab MVP: fixed-camera parking-spot occupancy (free/occupied) from public datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.4,<2.2",
  "opencv-python-headless>=4.8.0,<4.12",
  "Pillow>=10.0.0,<12",
  "PyYAML>=6.0.2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
app = [
  "streamlit>=1.40,<1.46",
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.34,<0.36",
]
patchcnn = [
  "torch>=2.2,<3",
]
yolo = [
  "ultralytics>=8.3.70,<8.4",
]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
parking-mvp = "parking_mvp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
